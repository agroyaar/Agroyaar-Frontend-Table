name: CI & Auto PR

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install pnpm
        run: |
          npm install -g pnpm@10.12.1
          echo "$(npm bin -g)" >> $GITHUB_PATH

      - name: 📥 Check for existing PR
        id: pr-check
        run: |
          PR_COUNT=$(gh pr list --head "${GITHUB_REF_NAME}" --json number --jq 'length')
          echo "pr_count=$PR_COUNT" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Create Pull Request
        if: steps.pr-check.outputs.pr_count == '0'
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Auto PR: ${{ github.ref_name }}"
          branch: ${{ github.ref_name }}
          base: main
          body: |
            This PR was automatically created for branch `${{ github.ref_name }}`
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false

  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install pnpm
        run: |
          npm install -g pnpm@10.12.1
          echo "$(npm bin -g)" >> $GITHUB_PATH

      - name: 📥 Install dependencies
        run: pnpm install

      - name: ✅ Type check
        run: pnpm type-check

      - name: 🔤 Spell check
        run: pnpm spell-check

      - name: 🧹 Lint
        run: pnpm lint

      - name: 🏗️ Build
        run: pnpm build
